# Runs on merge to the production branch, like the build - but this trigger
# requires manual approval. Cloud Build holds the build in PENDING and does
# not start it until someone holding roles/cloudbuild.builds.approver approves
# it in the console.
#
# Nothing is built here. cloudbuild-build.yaml already built the image, pushed
# it to the lower registry and pointed dev at it. This job points qa and uat
# at that same image once a human says it is allowed to move.
#
# The digest is resolved from the commit, NOT from envs/dev. envs/dev advances
# on every merge, and approval may happen days later - reading it at approval
# time would promote whatever landed most recently instead of what was
# approved. Resolving the version tag this commit produced pins the answer to
# the commit the approver actually looked at.
#
# Steps are split by tool: the git builder has no yq, and the yq image has
# no git.

steps:

  - id: 'resolve-digest'
    name: 'gcr.io/go-containerregistry/gcrane:debug'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        # must match the version computed in cloudbuild-build.yaml
        SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
        VERSION="1.0.0-rc.$$SHORT"
        IMG="${_LOWER_REGISTRY}/${_SERVICE}:$$VERSION"

        DIGEST=$(gcrane digest "$$IMG" 2>/dev/null) || {
          echo "no image at $$IMG"
          echo "the build for this commit either has not finished yet or failed"
          exit 1
        }

        echo "$$VERSION" > /workspace/VERSION
        echo "$$DIGEST"  > /workspace/DIGEST
        echo "promoting $$IMG"
        echo "digest    $$DIGEST"

  - id: 'clone-gitops'
    name: 'gcr.io/cloud-builders/git'
    secretEnv: ['GITHUB_TOKEN']
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        rm -rf /workspace/gitops
        git clone -q "https://x-access-token:$$GITHUB_TOKEN@github.com/${_GITHUB_OWNER}/${_GITOPS_REPO}.git" /workspace/gitops

        # the yq image runs as uid 1000; git clones as root and /workspace
        # itself is root owned, so both need to be writable
        chmod a+rwX /workspace
        chmod -R a+rwX /workspace/gitops

  - id: 'set-qa-uat-digests'
    name: 'mikefarah/yq:4'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        VERSION=$(cat /workspace/VERSION)
        DIGEST=$(cat /workspace/DIGEST)

        for ENV in qa uat; do
          yq -i ".image.repository = \"${_LOWER_REGISTRY}/${_SERVICE}\" |
                 .image.tag        = \"$$VERSION\" |
                 .image.digest     = \"$$DIGEST\"" \
            "/workspace/gitops/envs/$$ENV/apps/${_SERVICE}.yaml"
        done

  - id: 'push-gitops'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        VERSION=$(cat /workspace/VERSION)
        cd /workspace/gitops

        git config user.name  "cloud-build"
        git config user.email "cloud-build@poc.local"
        git add envs/qa/apps/${_SERVICE}.yaml envs/uat/apps/${_SERVICE}.yaml

        # approving the same digest again is a no-op, not a failure
        git diff --cached --quiet && { echo "no change"; exit 0; }

        git commit -m "chore(qa,uat): poc-service $$VERSION (approved)"
        git push origin main

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudbuild-github-token/versions/latest
      env: GITHUB_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: 'poc-service'
  _LOWER_REGISTRY: 'asia-south1-docker.pkg.dev/elaborate-art-504407-a2/poc-lower'
  _GITHUB_OWNER: 'vedantpanwar-styli'
  _GITOPS_REPO: 'styli-poc-gitops'

# How long the build may sit waiting to be picked up. Approval time is not
# counted against this, but keep it generous - see README, the pending-build
# expiry is the one thing to watch with console approvals.
queueTtl: 86400s

timeout: 900s
