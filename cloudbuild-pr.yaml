## Runs on pull requests targeting the production branch.
# SonarQube only. Build and scans run on the merge itself.

steps:

  - id: 'install'
    name: 'node:20.14.0-alpine'
    entrypoint: npm
    args: ['install', '--no-audit', '--no-fund']

  # TODO: replace with sonar-scanner once the SonarQube server is available
  - id: 'sonarqube'
    name: 'node:20.14.0-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        echo "SonarQube quality gate (stub)"
        echo "commit=$COMMIT_SHA branch=$BRANCH_NAME"
        npm run lint
        npm test
        echo "quality gate: PASSED"

options:
  logging: CLOUD_LOGGING_ONLY
