# Runs on merge to the release branch.
# Builds the image once, pushes to the lower registry, and points
# dev, qa and uat at that digest in the gitops repo.

steps:

  - id: 'version'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: sh
    args:
      - -c
      - |
        # TODO: replace with release-please once conventional commits are enforced
        SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
        echo "1.0.0-rc.$SHORT" > /workspace/VERSION
        cat /workspace/VERSION

  - id: 'unit-tests'
    name: 'node:20.14.0-alpine'
    entrypoint: sh
    args: ['-c', 'npm install --no-audit --no-fund && npm test']

  # TODO: replace with real Gitleaks / Trivy / Checkov steps
  - id: 'security-scans'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: sh
    args:
      - -c
      - |
        echo "gitleaks (stub): PASSED"
        echo "trivy fs (stub): PASSED"
        echo "checkov  (stub): PASSED"

  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: sh
    args:
      - -c
      - |
        VERSION=$(cat /workspace/VERSION)
        docker build \
          --build-arg VERSION="$VERSION" \
          --build-arg COMMIT_SHA="$COMMIT_SHA" \
          -t candidate:local .

  # scan before push so a failing image never reaches the registry
  # TODO: replace with trivy image --exit-code 1
  - id: 'scan-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: sh
    args: ['-c', 'echo "trivy image (stub): PASSED"']

  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: sh
    args:
      - -c
      - |
        VERSION=$(cat /workspace/VERSION)
        IMG="${_LOWER_REGISTRY}/${_SERVICE}"

        docker tag candidate:local "$IMG:$VERSION"
        docker push "$IMG:$VERSION"

        # the digest is what gets deployed and later promoted
        DIGEST=$(gcloud artifacts docker images describe "$IMG:$VERSION" \
                 --format='value(image_summary.digest)')
        echo "$DIGEST" > /workspace/DIGEST
        echo "pushed $IMG:$VERSION"
        echo "digest $DIGEST"

  - id: 'update-gitops'
    name: 'gcr.io/cloud-builders/git'
    secretEnv: ['GITHUB_TOKEN']
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        VERSION=$(cat /workspace/VERSION)
        DIGEST=$(cat /workspace/DIGEST)

        git clone -q "https://x-access-token:$$GITHUB_TOKEN@github.com/${_GITHUB_OWNER}/${_GITOPS_REPO}.git" /tmp/gitops
        cd /tmp/gitops
        apk add --no-cache yq >/dev/null 2>&1 || true

        # all three lower environments get the same digest
        for ENV in dev qa uat; do
          yq -i ".image.repository = \"${_LOWER_REGISTRY}/${_SERVICE}\" |
                 .image.tag        = \"$VERSION\" |
                 .image.digest     = \"$DIGEST\"" "envs/$ENV/apps/${_SERVICE}.yaml"
        done

        git config user.name  "cloud-build"
        git config user.email "cloud-build@poc.local"
        git add envs/dev/apps/${_SERVICE}.yaml envs/qa/apps/${_SERVICE}.yaml envs/uat/apps/${_SERVICE}.yaml
        git commit -m "chore(lower): poc-service $VERSION"
        git push origin main

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudbuild-github-token/versions/latest
      env: GITHUB_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _SERVICE: 'poc-service'
  _LOWER_REGISTRY: 'asia-south1-docker.pkg.dev/elaborate-art-504407-a2/poc-lower'
  _GITHUB_OWNER: 'vedantpanwar-styli'
  _GITOPS_REPO: 'styli-poc-gitops'

timeout: 1200s
