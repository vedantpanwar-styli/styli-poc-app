# Runs on merge to the production branch.
#
# Copies the image uat approved into the production registry under a new tag.
# Nothing is built here.
#
# Production will eventually live in its own GCP project with its own registry.
# The copy is a manifest transfer, so the digest survives the move between
# projects untouched - that is what lets the same artifact reach production
# without a rebuild. Only _PROD_REGISTRY below changes when that happens.
#
# Steps are split by tool: the git builder has no yq, and the yq image has
# no git.

steps:

  - id: 'clone-gitops'
    name: 'gcr.io/cloud-builders/git'
    secretEnv: ['GITHUB_TOKEN']
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        rm -rf /workspace/gitops
        git clone -q "https://x-access-token:$$GITHUB_TOKEN@github.com/${_GITHUB_OWNER}/${_GITOPS_REPO}.git" /workspace/gitops

        # the yq image runs as uid 1000; git clones as root and /workspace
        # itself is root owned, so both need to be writable
        chmod a+rwX /workspace
        chmod -R a+rwX /workspace/gitops

  # uat is the last gate before production, so envs/uat records what was actually
  # signed off - regardless of how long testing took or what landed since
  - id: 'read-uat-digest'
    name: 'mikefarah/yq:4'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        F=/workspace/gitops/envs/uat/apps/${_SERVICE}.yaml

        DIGEST=$(yq -r '.image.digest' "$$F")
        SRC_REPO=$(yq -r '.image.repository' "$$F")

        [ -n "$$DIGEST" ] && [ "$$DIGEST" != "null" ] || { echo "no digest in envs/uat"; exit 1; }

        echo "$$DIGEST"   > /workspace/DIGEST
        echo "$$SRC_REPO" > /workspace/SRC_REPO
        echo "uat digest: $$DIGEST"

  - id: 'prod-version'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: sh
    args:
      - -c
      - |
        VERSION="v$(date +%y).$(date +%-m).0"
        echo "$$VERSION" > /workspace/PROD_VERSION
        echo "version: $$VERSION"

  - id: 'copy-to-prod-registry'
    name: 'gcr.io/go-containerregistry/gcrane:debug'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        DIGEST=$(cat /workspace/DIGEST)
        SRC_REPO=$(cat /workspace/SRC_REPO)
        VERSION=$(cat /workspace/PROD_VERSION)

        gcrane copy "$$SRC_REPO@$$DIGEST" "${_PROD_REGISTRY}/${_SERVICE}:$$VERSION"

        # copy must not change the digest
        AFTER=$(gcrane digest "${_PROD_REGISTRY}/${_SERVICE}:$$VERSION")
        if [ "$$DIGEST" != "$$AFTER" ]; then
          echo "digest changed during copy: $$DIGEST -> $$AFTER"
          exit 1
        fi
        echo "copied, digest unchanged: $$AFTER"

  - id: 'set-prod-digest'
    name: 'mikefarah/yq:4'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        DIGEST=$(cat /workspace/DIGEST)
        VERSION=$(cat /workspace/PROD_VERSION)

        yq -i ".image.repository = \"${_PROD_REGISTRY}/${_SERVICE}\" |
               .image.tag        = \"$$VERSION\" |
               .image.digest     = \"$$DIGEST\"" \
          "/workspace/gitops/envs/prod/apps/${_SERVICE}.yaml"

  - id: 'push-gitops'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        VERSION=$(cat /workspace/PROD_VERSION)
        cd /workspace/gitops

        git config user.name  "cloud-build"
        git config user.email "cloud-build@poc.local"
        git add envs/prod/apps/${_SERVICE}.yaml

        # promoting the same digest again is a no-op, not a failure
        git diff --cached --quiet && { echo "no change"; exit 0; }

        git commit -m "release(prod): poc-service $$VERSION"
        git push origin main

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudbuild-github-token/versions/latest
      env: GITHUB_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: 'poc-service'
  # Currently in the lower project so the promotion path can be tested end to
  # end. Moving production to its own project means changing the project id
  # here and granting this build's service account artifactregistry.writer on
  # the new repository - see infra/environments/cicd-demo/infrastructure/registry-iam.tf
  _PROD_REGISTRY: 'asia-south1-docker.pkg.dev/elaborate-art-504407-a2/poc-prod'
  _GITHUB_OWNER: 'vedantpanwar-styli'
  _GITOPS_REPO: 'styli-poc-gitops'

timeout: 900s
